# RADIUS clients for the openUF validation lab.
#
# The whole compose `validation` bridge is trusted: the AP container's address
# is assigned by Docker and changes whenever the container is recreated, so
# pinning a single client address would only break the lab.
#
# This secret is a lab placeholder. It is the value you put into the
# controller's RADIUS profile (`x_secret`) in README section 1c.
client validation-net {
	ipaddr = 172.16.0.0
	netmask = 12
	secret = openufradius
	require_message_authenticator = no
	nas_type = other
}

